# Cloud Build 配置：在 GCP 上构建并部署到 Cloud Run
# 触发方式：push 到 main 分支时自动触发

steps:
  # 1. 构建 Docker 镜像
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/rebloom-ai:$SHORT_SHA'
      - '.'

  # 2. 推送到 Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/rebloom-ai:$SHORT_SHA'

  # 3. 部署到 Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'rebloom-ai'
      - '--image'
      - 'gcr.io/$PROJECT_ID/rebloom-ai:$SHORT_SHA'
      - '--region'
      - 'asia-southeast1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'GOOGLE_CLOUD_PROJECT=$PROJECT_ID'
      - '--set-env-vars'
      - 'AGENT_ENDPOINT_ASSESSMENT=${_AGENT_ENDPOINT_ASSESSMENT}'
      - '--set-env-vars'
      - 'AGENT_ENDPOINT_COACH=${_AGENT_ENDPOINT_COACH}'
      - '--set-env-vars'
      - 'AGENT_ENDPOINT_MEMORY=${_AGENT_ENDPOINT_MEMORY}'
      - '--set-env-vars'
      - 'AGENT_ENDPOINT_PROACTIVE=${_AGENT_ENDPOINT_PROACTIVE}'
      - '--set-env-vars'
      - 'AGENT_ENDPOINT_MENTOR_MATCH=${_AGENT_ENDPOINT_MENTOR_MATCH}'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--timeout'
      - '300'

substitutions:
  # 这些需要在 Cloud Build 触发器里配置
  _AGENT_ENDPOINT_ASSESSMENT: projects/107927033625/locations/us-west1/reasoningEngines/5963861020219801600
  _AGENT_ENDPOINT_COACH: projects/107927033625/locations/us-west1/reasoningEngines/3754845402994573312
  _AGENT_ENDPOINT_MEMORY: projects/107927033625/locations/us-west1/reasoningEngines/6254343196185198592
  _AGENT_ENDPOINT_PROACTIVE: projects/107927033625/locations/us-west1/reasoningEngines/7979221853468098560
  _AGENT_ENDPOINT_MENTOR_MATCH: projects/107927033625/locations/us-west1/reasoningEngines/8951999372980125696

images:
  - 'gcr.io/$PROJECT_ID/rebloom-ai:$SHORT_SHA'
