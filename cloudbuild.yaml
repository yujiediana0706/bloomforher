# Cloud Build configuration: build and deploy to Cloud Run on GCP.
# Trigger: automatically runs on every push to the main branch.

steps:
  # 1. Build the Docker image.
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/rebloom-ai:$SHORT_SHA'
      - '.'

  # 2. Push the image to Google Container Registry.
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/rebloom-ai:$SHORT_SHA'

  # 3. Deploy to Cloud Run (agent endpoints are inlined; no trigger config needed).
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'rebloom-ai'
      - '--image'
      - 'gcr.io/$PROJECT_ID/rebloom-ai:$SHORT_SHA'
      - '--region'
      - 'asia-southeast1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--set-env-vars'
      - 'GOOGLE_CLOUD_PROJECT=$PROJECT_ID,FIREBASE_PROJECT_ID=$PROJECT_ID,FIRESTORE_DATABASE_ID=buildercup2026,AUTH_SECRET=rebloom-cloud-run-auth-secret-2026,AGENT_ENDPOINT_ASSESSMENT=projects/107927033625/locations/us-west1/reasoningEngines/5963861020219801600,AGENT_ENDPOINT_COACH=projects/107927033625/locations/us-west1/reasoningEngines/3754845402994573312,AGENT_ENDPOINT_MEMORY=projects/107927033625/locations/us-west1/reasoningEngines/6254343196185198592,AGENT_ENDPOINT_PROACTIVE=projects/107927033625/locations/us-west1/reasoningEngines/7979221853468098560,AGENT_ENDPOINT_MENTOR_MATCH=projects/107927033625/locations/us-west1/reasoningEngines/8951999372980125696'
      - '--memory'
      - '512Mi'
      - '--cpu'
      - '1'
      - '--timeout'
      - '300'

options:
  logging: CLOUD_LOGGING_ONLY

images:
  - 'gcr.io/$PROJECT_ID/rebloom-ai:$SHORT_SHA'
